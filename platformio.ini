; =============================================================================
;  LilyGo T-Watch-S3 – Apple-Style Firmware
;  ESP32-S3R8 · 16 MB Flash (QIO) · 8 MB PSRAM (OPI) · ST7789 240x240 · FT6336
; =============================================================================

[platformio]
default_envs = twatch-s3

[env:twatch-s3]
; 6.9.0 = Arduino-ESP32 Core 2.0.17. Bewusst NICHT Core 3.x:
; IRremoteESP8266 ist (Stand heute) mit Core 3.x nicht kompatibel.
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Board-Overrides für die T-Watch-S3 ---------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.f_flash             = 80000000L
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder
upload_speed    = 921600
; Native USB (USB-Serial-JTAG): RTS/DTR-Reset klappt nicht immer, wenn die
; Firmware läuft -> Reset über den USB-Controller erzwingen. Der esptool-Stub
; verliert auf der Watch danach die Verbindung ("Unable to verify flash chip
; connection") -> direkt mit dem ROM-Bootloader flashen (kaum langsamer).
board_upload.before_reset = usb_reset
upload_flags    = --no-stub

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; LVGL findet include/lv_conf.h über diesen Schalter
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; NimBLE: Peripheral (Server fürs Handy) + Observer (BLE-Scanner im Hack-Tool)
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

build_unflags =
    -std=gnu++11

lib_deps =
    lvgl/lvgl@~8.3.11
    lovyan03/LovyanGFX@^1.1.16
    lewisxhe/XPowersLib@^0.2.6
    h2zero/NimBLE-Arduino@^1.4.3
    crankyoldgit/IRremoteESP8266@^2.8.6
    ; BMA423 (Schrittzähler) + DRV2605 (Vibration)
    lewisxhe/SensorLib@^0.2.6
